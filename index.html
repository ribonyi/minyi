<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>올바른 성 지식 퀴즈</title>
    <style>
        /* 깔끔하고 세련된 모바일/웹 겸용 디자인 */
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        .progress-bar {
            height: 6px;
            background-color: #e2e8f0;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        h2 {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 25px;
            word-break: keep-all;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            word-break: keep-all;
        }

        .option-btn:hover {
            background-color: #e2e8f0;
        }

        .option-btn.selected {
            background-color: #eef2ff;
            border-color: var(--primary-color);
            color: var(--primary-color);
            font-weight: 600;
        }

        .next-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 25px;
            cursor: pointer;
            display: none;
        }

        /* 결과 창 디자인 */
        .result-container {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #eef2ff;
            color: var(--primary-color);
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
        }

        .feedback-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #475569;
            word-break: keep-all;
        }

        .restart-btn {
            background-color: #1e293b;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 25px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div id="quiz-screen">
            <div class="progress-bar"><div class="progress" id="progress"></div></div>
            <div id="question-number" style="font-size: 0.9rem; color: #64748b; font-weight: 600; margin-bottom: 8px;"></div>
            <h2 id="question-text">질문 텍스트가 들어가는 곳입니다.</h2>
            <div class="options-container" id="options-container"></div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">다음 문제</button>
        </div>

        <div id="result-screen" class="result-container">
            <h1 style="font-size: 1.8rem; margin-bottom: 10px;">퀴즈 결과</h1>
            <div class="score-circle" id="score-text">0점</div>
            <p id="match-count" style="font-weight: 600; margin-bottom: 10px;"></p>
            <p class="feedback-text" id="feedback-text"></p>
            <button class="restart-btn" onclick="restartQuiz()">다시 풀기</button>
        </div>
    </div>

    <script>
        // 보낸 퀴즈 데이터를 웹용 데이터셋으로 적용
        const quizData = [
            {
                question: "콘돔을 지갑 속에 보관하면 돈을 많이 벌 수 있다는 말이 있다. 지갑 속에 넣고 다닌 콘돔, 사용해도 괜찮을까?",
                options: ["O (괜찮다)", "X (안 된다)"],
                correct: 1
            },
            {
                question: "콘돔 사용 시 피임 실패율을 높이는 ‘가장 위험한 보관 장소’는?",
                options: ["침대 옆 서랍", "가방 안쪽 지퍼 포켓", "청바지 뒷주머니 혹은 지갑 속", "햇빛이 들지 않는 서늘한 상자"],
                correct: 2
            },
            {
                question: "콘돔을 착용할 때 반드시 지켜야 할 매너 및 안전 수칙으로 옳은 것은?",
                options: ["확실한 피임을 위해 콘돔 두 개를 겹쳐 사용한다.", "유통기한에 개의치않고 외관상 문제가 없다면 사용한다.", "콘돔의 끝부분을 살며시 눌러 공기가 빠져나가게 한다.", "착용이 뻑뻑할 경우 바세린이나 베이비 오일을 바른다."],
                correct: 2
            },
            {
                question: "관계 후 외음부를 세정할 때 가장 권장되는 올바른 방법은?",
                options: ["강한 수압의 샤워기로 질 내부까지 깊숙이 헹군다.", "일반 알칼리성 비누로 거품을 많이 내어 씻는다.", "세균 박멸을 위해 뜨거운 물로 오래 소독하듯 씻는다.", "미온수나 전용 약산성 청결제로 겉부분만 가볍게 씻는다."],
                correct: 3
            },
            {
                question: "콘돔의 일반적인 사용 시 피임률은?",
                options: ["98% 이상", "90~95%", "82~85%", "80% 이하"],
                correct: 2
            },
            {
                question: "성병(성매개감염병)에 대한 상식 중 옳지 않은 것은?",
                options: ["증상이 없어도 성병에 감염된 상태일 수 있다.", "구강성교를 통해서도 성병(임질, 매독 등)이 전염될 수 있다.", "콘돔을 완벽하게 착용한다면 사타구니 주변을 포함해 생기는 모든 성병을 막을 수 있다.", "정기적인 성병 검사는 파트너에 대한 중요한 매너이다."],
                correct: 2
            },
            {
                question: "생리 기간 중 성관계(생리 중 관계)에 대한 설명으로 옳은 것은?",
                options: ["생리 중에는 배란이 되지 않으므로 100% 임신이 불가능하다.", "생리 혈이 천연 윤활제 역할을 하므로 질염 예방에 도움이 된다.", "생리 중에도 임신 가능성이 존재하며, 세균 감염 위험이 평소보다 훨씬 높다.", "생리 중에는 자궁 경부가 닫히므로 외부 균이 들어올 수 없다."],
                correct: 3
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let selectedAnswer = null;

        function loadQuestion() {
            selectedAnswer = null;
            document.getElementById('next-btn').style.display = 'none';
            
            const currentQuiz = quizData[currentIdx];
            
            // 상단 진행 바 & 문제 번호 업데이트
            const progressPercent = ((currentIdx) / quizData.length) * 100;
            document.getElementById('progress').style.width = `${progressPercent}%`;
            document.getElementById('question-number').innerText = `문제 ${currentIdx + 1} / ${quizData.length}`;
            
            // 문제 텍스트 적용
            document.getElementById('question-text').innerText = currentQuiz.question;
            
            // 보기 생성
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            currentQuiz.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.classList.add('option-btn');
                button.innerText = option;
                button.onclick = () => selectOption(index, button);
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(index, button) {
            // 이전에 선택된 버튼 효과 해제
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.classList.remove('selected'));
            
            // 현재 버튼 선택 효과 및 데이터 저장
            button.classList.add('selected');
            selectedAnswer = index;
            
            // 다음 버튼 활성화
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            // 정답 체크 (인덱스는 0부터 시작하므로 맞으면 score 증가)
            if (selectedAnswer === quizData[currentIdx].correct) {
                score++;
            }
            
            currentIdx++;
            
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            
            const finalScore = Math.round((score / quizData.length) * 100);
            document.getElementById('score-text').innerText = `${finalScore}점`;
            document.getElementById('match-count').innerText = `맞은 개수: ${score} / ${quizData.length}`;
            
            let feedback = "";
            if (finalScore === 100) {
                feedback = "완벽합니다! 올바르고 안전한 성 지식을 마스터하셨네요. 훌륭한 파트너입니다! 👍";
            } else if (finalScore >= 70) {
                feedback = "대체로 훌륭한 지식을 가지고 계시네요! 헷갈렸던 부분만 조금 더 신경 쓰면 완벽할 것 같아요. 😊";
            } else {
                feedback = "안전과 건강한 관계를 위해 피임 및 성 지식을 다시 한번 체크해 보는 것을 추천합니다! 🩺";
            }
            document.getElementById('feedback-text').innerText = feedback;
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            document.getElementById('quiz-screen').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';
            loadQuestion();
        }

        // 첫 실행
        loadQuestion();
    </script>
</body>
</html>
